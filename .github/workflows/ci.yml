# Ox OS — self-verifying CI (free GitHub runners, no KVM needed).
#
# Two parallel jobs:
#   core    — qemu kernel/payload + PinePhone Pro + BOTH composite boot
#             gates (slotboot + flashpack) in QEMU TCG
#   fleet   — the three Android-chain targets, build-verify only
#
# A cold store (first run / after GC) builds the kernel + rust from
# source on 2 cores: ~2-4h for core. 350min timeout holds; the 6h cap
# is the ceiling. Public repo = unlimited free minutes.
#
# Requirements: repo root == the flake (what lives in /root/oxbuild).

name: ox-ci
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1" # weekly proof-of-life, Mondays 04:00 UTC

env:
  NIX: /nix/var/nix/profiles/per-user/root/profile/bin/nix

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Free disk space (nix store closures are big)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet \
                      /opt/ghc /usr/local/.ghc \
                      /opt/hostedtoolcache/Code || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - uses: actions/checkout@v4

      - name: Reproduce the build-box layout (/root/oxbuild)
        run: |
          sudo mkdir -p /root
          sudo ln -sfn "$GITHUB_WORKSPACE" /root/oxbuild

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-24.11
          extra_nix_config: |
            cores = 2
            max-jobs = 1

      - name: Root-profile nix symlink (the gates hardcode this path)
        run: |
          P=$(ls -d /nix/var/nix/profiles/per-user/*/profile 2>/dev/null | head -1)
          sudo mkdir -p /nix/var/nix/profiles/per-user/root
          sudo ln -sfn "$P" /nix/var/nix/profiles/per-user/root/profile
          "$NIX" --version

      - name: Build qemu platform + PinePhone Pro
        run: |
          cd /root/oxbuild
          "$NIX" build .#image-pinephone-pro .#kernel-qemu .#payload-qemu \
            --no-link --print-out-paths 2>&1 | tee /tmp/nixout.txt

      - name: Boot gate — A/B slot lifecycle (slotboot)
        run: |
          cd /root/oxbuild
          sudo -E bash tools/target-slotboot-gate-run.sh 2>&1 | tee /tmp/slotboot.log
          grep -q "SLOT-BOOT TARGET GATE ALL GREEN" /tmp/slotboot.log

      - name: Boot gate — flash-pack + enrollment
        run: |
          cd /root/oxbuild
          sudo -E bash tools/target-flashpack-gate-run.sh 2>&1 | tee /tmp/flashpack.log
          grep -q "FLASHPACK TARGET GATE ALL GREEN" /tmp/flashpack.log

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-gate-logs
          path: |
            /tmp/slotboot.log
            /tmp/flashpack.log
          if-no-files-found: ignore

  fleet:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet \
                      /opt/ghc /usr/local/.ghc \
                      /opt/hostedtoolcache/Code || true
          sudo docker image prune -af >/dev/null 2>&1 || true

      - uses: actions/checkout@v4

      - name: Reproduce the build-box layout
        run: |
          sudo mkdir -p /root
          sudo ln -sfn "$GITHUB_WORKSPACE" /root/oxbuild

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-24.11
          extra_nix_config: |
            cores = 2
            max-jobs = 1

      - name: Root-profile nix symlink
        run: |
          P=$(ls -d /nix/var/nix/profiles/per-user/*/profile 2>/dev/null | head -1)
          sudo mkdir -p /nix/var/nix/profiles/per-user/root
          sudo ln -sfn "$P" /nix/var/nix/profiles/per-user/root/profile
          "$NIX" --version

      - name: Build the Android-chain targets
        run: |
          cd /root/oxbuild
          "$NIX" build .#image-fairphone5 .#image-oneplus9rt \
            .#image-oneplus10pro --no-link --print-out-paths 2>&1 \
            | tee /tmp/nixout.txt
